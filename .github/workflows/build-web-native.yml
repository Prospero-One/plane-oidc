name: Build OIDC Web Image Natively

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: d2d6aeeb14eb84215fbb8ff8e6c71a58b1a970a4
  IMAGE: ghcr.io/prospero-one/plane-web-oidc
  IMAGE_VERSION: v1.3.1-oidc-d2d6aeeb

jobs:
  build:
    name: Build Web (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_VERSION }}-${{ matrix.suffix }}
          no-cache: true

  publish:
    name: Publish Web manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${IMAGE_VERSION}" \
            "${IMAGE}:${IMAGE_VERSION}-amd64" \
            "${IMAGE}:${IMAGE_VERSION}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${IMAGE_VERSION}"
